name: Dostępność Grudzień

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: Wyślij tylko powiadomienie testowe
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: grudzien-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pobierz domyślną gałąź
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Testy bez połączeń sieciowych
        run: python3 -m unittest -v
      - name: Sprawdź produkty lub wyślij test
        id: monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: |
          if [ "$TEST_NOTIFICATION" = "true" ]; then
            python3 monitor.py --test-notification
          else
            python3 monitor.py
          fi
      - name: Zachowaj stan także po częściowym błędzie
        if: always() && !inputs.test_notification && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -f state.json ]; then
            git add -- state.json
            if ! git diff --cached --quiet -- state.json; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m "Zaktualizuj stan dostępności" -- state.json
              git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
            fi
          fi
